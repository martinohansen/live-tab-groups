<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0.4" dy="0.8" stdDeviation="0.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fbcff"/>
      <stop offset="1" stop-color="#1f5fc4"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#d6d6d6"/>
    </linearGradient>
    <linearGradient id="grey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ececec"/>
      <stop offset="1" stop-color="#a5a5a5"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e6ffd6"/>
      <stop offset="0.45" stop-color="#3cc23c"/>
      <stop offset="1" stop-color="#1f8a1f"/>
    </radialGradient>
  </defs>
  <g filter="url(#shadow)" stroke="#333" stroke-width="1">
    <rect x="2.5" y="3.5" width="4" height="25" rx="2" fill="url(#blue)"/>
    <rect x="9.5" y="3.5" width="20" height="7" rx="2" fill="url(#white)"/>
    <rect x="9.5" y="12.5" width="20" height="7" rx="2" fill="url(#grey)"/>
    <rect x="9.5" y="21.5" width="20" height="7" rx="2" fill="url(#grey)"/>
  </g>
  <g fill="#fff">
    <rect x="3.6" y="5" width="1" height="21" rx="0.5" opacity="0.7"/>
    <rect x="17" y="4.6" width="11" height="1.3" rx="0.65" opacity="0.9"/>
    <rect x="11" y="13.6" width="17" height="1.3" rx="0.65" opacity="0.8"/>
    <rect x="11" y="22.6" width="17" height="1.3" rx="0.65" opacity="0.8"/>
  </g>
  <circle cx="13.5" cy="7" r="2" fill="url(#dot)" stroke="#1b6e1b" stroke-width="0.6"/>
</svg>
